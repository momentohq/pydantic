language = "python"
test_command = "python -m pytest tests"
repo = "pydantic/pydantic"   # this is a fork; its merged pull requests are upstream's
worker_image = "python:3.13-bookworm@sha256:933b46a028fd786c9c3d426ebabc237e29a15912231ea8de576e95f0e4f41a4c"
# `pydantic-core` installs from a published wheel rather than compiling, so no Rust toolchain is
# needed in the worker. `--group dev` carries pytest and the test-only dependencies.
# The `email` extra is NOT optional for the test suite even though the package calls it optional:
# pytest collects the whole tree, so one module importing `email_validator` fails COLLECTION and every
# task is then rejected as "the reference state does not pass its own oracle" — the repository reads
# as unfit when one extra was missing (#3993).
setup_command = "python -m pip install --disable-pip-version-check -e .[email,timezone] --group dev"
