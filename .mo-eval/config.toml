language = "python"
test_command = "python -m pytest tests --ignore=tests/pydantic_core"
repo = "pydantic/pydantic"   # this is a fork; its merged pull requests are upstream's
worker_image = "python:3.13-bookworm@sha256:933b46a028fd786c9c3d426ebabc237e29a15912231ea8de576e95f0e4f41a4c"
# `pydantic-core` installs from a published wheel rather than compiling, so no Rust toolchain is
# needed in the worker. `--group dev` carries pytest and the test-only dependencies.
# `tests/pydantic_core/` is a VENDORED test tree for a different package, and its dependencies are
# declared in that package rather than here — `hypothesis` first, then more behind it. Scoping the
# command to pydantic's own tests is the correct configuration, not a workaround.
#
# Why it matters beyond this repository: pytest collects the whole tree before running anything, so
# ONE unimportable conftest fails collection and every candidate is then rejected as "the reference
# state does not pass its own oracle". Measured here: 7209 tests collected, 1 collection error, 0 of 8
# tasks survived — the repository reads as unfit because one module in a vendored subtree was missing
# (#3993).
setup_command = "python -m pip install --disable-pip-version-check -e .[email,timezone] --group dev"
